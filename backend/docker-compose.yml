version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow_hrms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dayflow_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dayflow_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dayflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dayflow_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  dayflow_network:
    driver: bridge
